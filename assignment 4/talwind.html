<!doctype html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100">
    <div class="max-w-2xl mx-auto my-8 sm:my-12 lg:my-20 bg-white border border-gray-300 rounded-lg shadow-lg overflow-hidden">
        <div class="sm:text-4xl md:bg-red-500 lg:bg-blue-200 h-20 bg-linear-to-r/srgb from-indigo-400 to-teal-600 text-white flex justify-center items-center rounded-t-sm">
            <h1 class="text-3xl font-bold text-white">
                Tailwind CSS
            </h1>
        </div>
        <div class="p-5 text-center">
            <h2 class="text-lg sm:text-xl font-semibold mb-3">
                Intro Of Tailwind CSS
            </h2>
            <p class="text-gray-700 mb-6 text-sm sm:text-base">
                Tailwind CSS is a utility-first CSS framework used by web developers to design websites directly inside their HTML markup. 
            </p>
            <form class="w-full max-w-md mx-auto space-y-3">
                <input type="text" placeholder="Enter Your Name" class="w-full p-3 bg-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button class="w-full md:bg-red-200 lg:bg-blue-200 h-10 bg-linear-to-r/srgb from-indigo-200 to-teal-200 text-black p-3 rounded-lg transition">
                    Submit
                </button>
              </form>
            <!-- <p class="mt-4 font-semibold text-gray-700">
                Thank You!
            </p> -->

        </div>

    </div>

</body>
</html>
